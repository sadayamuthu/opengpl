name: Publish Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file not found at repo root."
            exit 1
          fi
          if ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION; then
            echo "::error::VERSION content is not valid semver (MAJOR.MINOR.PATCH): $(cat VERSION)"
            exit 1
          fi
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION does not exist — will create release."
          fi

      - name: Build archives
        if: steps.tag_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          # tar.gz — exclude .git directory
          tar --exclude='.git' --exclude='dist' -czf "dist/opengpl-v${VERSION}.tar.gz" .
          # zip — exclude .git directory
          zip -r "dist/opengpl-v${VERSION}.zip" . --exclude './.git' --exclude './.git/*' --exclude './dist' --exclude './dist/*'
          ls -lh dist/

      - name: Create release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.2.1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OpenGPL v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/opengpl-v${{ steps.version.outputs.version }}.tar.gz
            dist/opengpl-v${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish schema to opengpl.org
        if: steps.tag_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEPLOY_TOKEN: ${{ secrets.OPENGPL_ORG_DEPLOY_TOKEN }}
        run: |
          # Derive schema version directory from VERSION (e.g. "0.1.0" -> "v0.1")
          SCHEMA_VERSION="v${VERSION%.*}"
          SOURCE_JSON="schema/opengpl-${SCHEMA_VERSION}.json"
          SOURCE_YAML="schema/opengpl-${SCHEMA_VERSION}.yaml"

          # Validate source schema files exist before proceeding
          for f in "$SOURCE_JSON" "$SOURCE_YAML"; do
            [ -f "$f" ] || { echo "::error::Schema file not found: $f"; exit 1; }
          done

          # Configure credential helper so token never appears in URLs or logs
          git config --global credential.helper \
            '!f() { echo "username=x-access-token"; echo "password='"${DEPLOY_TOKEN}"'"; }; f'

          if ! git clone "https://github.com/sadayamuthu/opengpl.org.git" opengpl-org; then
            echo "::error::Failed to clone opengpl.org. Check that OPENGPL_ORG_DEPLOY_TOKEN is set and valid."
            exit 1
          fi

          cd opengpl-org || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p "schemas/${SCHEMA_VERSION}"
          cp "../$SOURCE_JSON" "schemas/${SCHEMA_VERSION}/opengpl.schema.json"
          cp "../$SOURCE_YAML" "schemas/${SCHEMA_VERSION}/opengpl.schema.yaml"

          git add "schemas/${SCHEMA_VERSION}/"
          if git diff --cached --quiet; then
            echo "No schema changes to publish."
          else
            git commit -m "chore: publish OpenGPL v${VERSION} schema" || exit 1
            git push || { echo "::error::git push to opengpl.org failed."; exit 1; }
          fi
