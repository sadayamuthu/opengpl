name: Check Version Bump

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-version:
    name: Verify VERSION is bumped
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Get PR version
        id: pr_version
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file is missing from this PR."
            exit 1
          fi
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Get main version
        id: main_version
        run: |
          git fetch origin main --depth=1
          echo "version=$(git show origin/main:VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        env:
          PR_VERSION: ${{ steps.pr_version.outputs.version }}
          MAIN_VERSION: ${{ steps.main_version.outputs.version }}
        run: |
          echo "PR version:   $PR_VERSION"
          echo "Main version: $MAIN_VERSION"

          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo "::error::VERSION has not been bumped. PR=$PR_VERSION, main=$MAIN_VERSION"
            exit 1
          fi

          # Assumes strict MAJOR.MINOR.PATCH semver format in VERSION file
          # Use sort -V to compare: the higher version should sort last
          HIGHER=$(printf '%s\n%s\n' "$MAIN_VERSION" "$PR_VERSION" | sort -V | tail -n1)
          if [ "$HIGHER" != "$PR_VERSION" ]; then
            echo "::error::PR version ($PR_VERSION) is lower than main ($MAIN_VERSION). Update the VERSION file to a value greater than $MAIN_VERSION."
            exit 1
          fi

          echo "Version bump confirmed: $MAIN_VERSION -> $PR_VERSION"
